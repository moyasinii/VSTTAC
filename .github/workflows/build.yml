name: Build VST3 (Windows)

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:   # Actions 画面から手動実行もできる

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S plugin -B build

      - name: Build
        run: cmake --build build --config Release --target PreampPlugin_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PreampPlugin-VST3-Windows
          path: build/PreampPlugin_artefacts/Release/VST3/
